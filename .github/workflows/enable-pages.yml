name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        run: |
          cat > /tmp/pages.json << 'EOF'
          {"source": {"branch": "gh-pages", "path": "/"}}
          EOF
          gh api -X POST /repos/${{ github.repository }}/pages --input /tmp/pages.json || echo "Create failed, trying update"
          gh api -X PUT /repos/${{ github.repository }}/pages --input /tmp/pages.json || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
