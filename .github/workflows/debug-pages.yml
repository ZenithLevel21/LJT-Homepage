name: Debug Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check current pages status
        run: |
          echo "=== GET /pages ==="
          gh api repos/${{ github.repository }}/pages || echo "GET failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check actions permissions
        run: |
          echo "=== Actions permissions ==="
          gh api repos/${{ github.repository }}/actions/permissions || echo "failed"
          echo "=== Workflow permissions ==="
          gh api repos/${{ github.repository }}/actions/permissions/workflow || echo "failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try enable pages
        run: |
          echo "=== POST /pages ==="
          gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow || echo "POST failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
