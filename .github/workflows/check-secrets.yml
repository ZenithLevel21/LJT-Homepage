name: Check Secrets and Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List secrets (names only)
        run: |
          echo "=== Secrets ==="
          gh secret list -R ${{ github.repository }} || echo "failed to list secrets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if PAT exists
        run: |
          if [ -n "${{ secrets.PAT }}" ]; then
            echo "PAT exists"
          else
            echo "No PAT secret"
          fi
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "GH_PAT exists"
          else
            echo "No GH_PAT secret"
          fi
          if [ -n "${{ secrets.PAGES_TOKEN }}" ]; then
            echo "PAGES_TOKEN exists"
          else
            echo "No PAGES_TOKEN secret"
          fi
