name: Fix Pages Permissions

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check user permission level
        run: |
          echo "=== User repo permission ==="
          gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission || echo "failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try update workflow permissions to read/write
        run: |
          echo "=== Update workflow permissions ==="
          gh api -X PUT repos/${{ github.repository }}/actions/permissions/workflow -f default_workflow_permissions=write -f can_approve_pull_request_reviews=true || echo "PUT failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try enable pages again
        run: |
          echo "=== POST /pages ==="
          gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow || echo "POST failed"
          echo "=== GET /pages ==="
          gh api repos/${{ github.repository }}/pages || echo "GET failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
