name: Try Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  try-enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo info
        run: |
          echo "=== Repo info ==="
          gh api repos/${{ github.repository }} --jq '{fork: .fork, parent: .parent.full_name, has_pages: .has_pages, default_branch: .default_branch}' || echo "failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try enable pages with source branch
        run: |
          echo "=== Try POST /pages with source ==="
          gh api -X POST repos/${{ github.repository }}/pages \
            -f 'source[branch]=master' \
            -f 'source[path]=/' || echo "POST source failed"
          echo "=== Try POST /pages with build_type=legacy ==="
          gh api -X POST repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f 'source[branch]=master' \
            -f 'source[path]=/' || echo "POST legacy failed"
          echo "=== GET /pages ==="
          gh api repos/${{ github.repository }}/pages || echo "GET failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
